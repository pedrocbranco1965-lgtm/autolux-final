<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoStand Full Stack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">AutoStand Full Stack</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light" href="/login.html">Area reservada</a>
        </div>
    </div>
</nav>

<header class="hero">
    <div class="container">
        <h1 class="display-5 fw-bold">Catalogo de veiculos</h1>
        <p class="lead mb-0">Front-end JavaScript a consumir uma API REST Node.js + Express + MySQL.</p>
    </div>
</header>

<main class="container py-5">
    <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form id="filterForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Pesquisa</label>
                    <input id="q" class="form-control" placeholder="Marca ou modelo">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Tipo</label>
                    <select id="tipo" class="form-select">
                        <option value="">Todos</option>
                        <option value="carro">Carro</option>
                        <option value="moto">Moto</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Combustivel</label>
                    <select id="combustivel" class="form-select">
                        <option value="">Todos</option>
                        <option value="gasolina">Gasolina</option>
                        <option value="diesel">Diesel</option>
                        <option value="hibrido">Hibrido</option>
                        <option value="eletrico">Eletrico</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Estado</label>
                    <select id="estado" class="form-select">
                        <option value="">Todos</option>
                        <option value="disponivel">Disponivel</option>
                        <option value="reservado">Reservado</option>
                        <option value="vendido">Vendido</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-dark w-100" type="submit">Pesquisar</button>
                </div>
            </form>
        </div>
    </section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Veiculos</h2>
        <span id="total" class="text-muted"></span>
    </div>

    <div id="message"></div>
    <div id="vehicleList" class="row g-4"></div>
    <nav id="paginationNav" class="mt-4 d-flex justify-content-center" aria-label="Paginacao do catalogo"></nav>
</main>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
