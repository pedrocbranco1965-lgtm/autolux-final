services:
  php-app:
    build:
      context: ./php
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql-vendas
      DB_NAME: autolux_vendas
      DB_USER: autolux
      DB_PASS: autolux123
      NODE_API_URL: http://fornecedores-api:3000
    depends_on:
      mysql-vendas:
        condition: service_healthy
      fornecedores-api:
        condition: service_started

  fornecedores-api:
    build:
      context: ./fornecedores-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql-fornecedores
      DB_NAME: autolux_fornecedores
      DB_USER: autolux
      DB_PASS: autolux123
    depends_on:
      mysql-fornecedores:
        condition: service_healthy

  mysql-vendas:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: autolux_vendas
      MYSQL_USER: autolux
      MYSQL_PASSWORD: autolux123
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/vendas.sql:/docker-entrypoint-initdb.d/01-vendas.sql:ro
      - mysql-vendas-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "autolux", "-pautolux123"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-fornecedores:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: autolux_fornecedores
      MYSQL_USER: autolux
      MYSQL_PASSWORD: autolux123
    ports:
      - "3308:3306"
    volumes:
      - ./mysql/fornecedores.sql:/docker-entrypoint-initdb.d/01-fornecedores.sql:ro
      - mysql-fornecedores-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "autolux", "-pautolux123"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-vendas-data:
  mysql-fornecedores-data:
